name: FrontendForge release checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install master dependencies
        run: npm ci
      - name: Generate independent niche demo websites
        run: npm run generate:demo-clients
      - name: Static structure and schema checks
        run: |
          npm run check:structure
          npm run check:sql
      - name: Unit and generator tests
        run: npm test
      - name: Verify client projects and release audits
        run: npm run verify:demo-clients
      - name: Build master studio
        run: npm run build
      - name: Build all twelve generated client sites
        run: npm run build:clients
      - name: Install Playwright and Chromium
        run: |
          npm run install:e2e
          npx playwright install --with-deps chromium
      - name: Master desktop and mobile browser tests
        run: npm run test:e2e
      - name: All twelve client desktop and mobile browser tests
        run: npm run test:clients:e2e
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report-master/
            playwright-report/
            test-results/
            client-build-report.json
          if-no-files-found: ignore
